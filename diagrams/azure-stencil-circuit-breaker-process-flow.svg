<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b1120; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arB3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arG3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arR3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad3)"/>
  <rect x="0" y="0" width="1440" height="900" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header -->
  <rect x="30" y="24" width="1380" height="76" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#glow3)"/>
  <text x="60" y="55" fill="#f8fafc" font-size="20" font-weight="700">AUTONOMOUS FINOPS CIRCUIT BREAKER PROCESS FLOW</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">End-to-End Governance Lifecycle Across Edge Ingress, Forensic Telemetry, and Workload Identity Quarantine</text>
  <rect x="1220" y="44" width="160" height="34" rx="4" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
  <text x="1300" y="66" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">GOVERNANCE PIPELINE</text>

  <!-- 3 Swimlanes -->

  <!-- Swimlane 1: Plane 1 - APIM Ingress Gate (Top Swimlane) -->
  <g transform="translate(30, 125)" filter="url(#glow3)">
    <rect width="1380" height="225" rx="8" fill="#0c1e38" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="340" height="28" rx="4" fill="#0369a1"/>
    <text x="186" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">PLANE 1: EDGE INGRESS GATE (APIM RUNTIME, &lt; 2ms)</text>

    <!-- Node 1.1 -->
    <rect x="30" y="65" width="280" height="135" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="92" fill="#38bdf8" font-size="12" font-weight="700">1.1 Request Authentication</text>
    <text x="45" y="114" fill="#cbd5e1" font-size="11">&#x2022; Validate Entra ID Workload JWT</text>
    <text x="45" y="134" fill="#cbd5e1" font-size="11">&#x2022; Extract x-agent-session-id</text>
    <text x="45" y="154" fill="#cbd5e1" font-size="11">&#x2022; Verify API subscription key</text>
    <text x="45" y="176" fill="#34d399" font-size="11" font-weight="600">&#x2714; Authenticated in 0.4ms</text>

    <!-- Node 1.2 -->
    <rect x="360" y="65" width="300" height="135" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="375" y="92" fill="#38bdf8" font-size="12" font-weight="700">1.2 Token Bucket Verification</text>
    <text x="375" y="114" fill="#cbd5e1" font-size="11">&#x2022; Counter: azure-openai-token-limit</text>
    <text x="375" y="134" fill="#cbd5e1" font-size="11">&#x2022; Ceiling: 18,000 TPM per session</text>
    <text x="375" y="154" fill="#cbd5e1" font-size="11">&#x2022; Estimate prompt tokens ahead of call</text>
    <text x="375" y="176" fill="#34d399" font-size="11" font-weight="600">&#x2714; Check completed in 1.1ms</text>

    <!-- Node 1.3 Permitted -->
    <rect x="710" y="65" width="300" height="135" rx="6" fill="#0f291e" stroke="#059669"/>
    <text x="725" y="92" fill="#34d399" font-size="12" font-weight="700">1.3A Under Budget: Model Call</text>
    <text x="725" y="114" fill="#a7f3d0" font-size="11">&#x2022; Forward to Azure OpenAI endpoint</text>
    <text x="725" y="134" fill="#a7f3d0" font-size="11">&#x2022; Private Endpoint VNet routing</text>
    <text x="725" y="154" fill="#a7f3d0" font-size="11">&#x2022; Emit token consumption metric</text>
    <text x="725" y="176" fill="#34d399" font-size="11" font-weight="600">&#x2714; HTTP 200 OK + Payload</text>

    <!-- Node 1.3 Trip -->
    <rect x="1050" y="65" width="300" height="135" rx="6" fill="#2d1215" stroke="#dc2626"/>
    <text x="1065" y="92" fill="#ef4444" font-size="12" font-weight="700">1.3B Over Quota: Edge Trip</text>
    <text x="1065" y="114" fill="#fca5a5" font-size="11">&#x2022; Reject in &lt; 2ms (Zero compute hit)</text>
    <text x="1065" y="134" fill="#fca5a5" font-size="11">&#x2022; HTTP 429 TooManyRequests</text>
    <text x="1065" y="154" fill="#fca5a5" font-size="11">&#x2022; Return Retry-After header</text>
    <text x="1065" y="176" fill="#ef4444" font-size="11" font-weight="600">🛑 SESSION THROTTLED</text>
  </g>

  <!-- Swimlane 2: Plane 2 - Telemetry Sentinel & Anomaly Plane (Middle Swimlane) -->
  <g transform="translate(30, 370)" filter="url(#glow3)">
    <rect width="1380" height="235" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="16" y="16" width="380" height="28" rx="4" fill="#4338ca"/>
    <text x="206" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">PLANE 2: TELEMETRY SENTINEL &amp; ANOMALY FORENSICS</text>

    <!-- Node 2.1 -->
    <rect x="30" y="65" width="310" height="145" rx="6" fill="#0b1120" stroke="#312e81"/>
    <text x="45" y="92" fill="#818cf8" font-size="12" font-weight="700">2.1 Telemetry Emission</text>
    <text x="45" y="114" fill="#cbd5e1" font-size="11">&#x2022; &lt;azure-openai-emit-token-metric&gt;</text>
    <text x="45" y="134" fill="#cbd5e1" font-size="11">&#x2022; Custom Dimensions: AgentOID, SessionId</text>
    <text x="45" y="154" fill="#cbd5e1" font-size="11">&#x2022; Streams to Azure Monitor &amp; Log Analytics</text>
    <text x="45" y="176" fill="#cbd5e1" font-size="11">&#x2022; Cosmos DB updates rolling 60s burn state</text>
    <text x="45" y="196" fill="#34d399" font-size="11" font-weight="600">&#x2714; Continuous multi-tenant attribution</text>

    <!-- Node 2.2 -->
    <rect x="390" y="65" width="460" height="145" rx="6" fill="#0b1120" stroke="#312e81"/>
    <text x="405" y="92" fill="#818cf8" font-size="12" font-weight="700">2.2 KQL Sliding-Window Anomaly Query</text>
    <text x="405" y="114" fill="#c7d2fe" font-size="11" font-weight="600">AzureDiagnostics | where TimeGenerated &gt; ago(5m)</text>
    <text x="405" y="134" fill="#94a3b8" font-size="10.5">| summarize Calls = count(), Tokens = sum(TotalTokens) by SessionId, 1m</text>
    <text x="405" y="154" fill="#94a3b8" font-size="10.5">| where Calls &gt; 12 or Tokens &gt; 18000 or Throttle429Count &gt; 0</text>
    <text x="405" y="176" fill="#ef4444" font-size="11" font-weight="600">&#x2022; Evaluates 16 deterministic safety assertions</text>
    <text x="405" y="196" fill="#fbbf24" font-size="11" font-weight="600">&#x26A0; Catches recursive retry loops before cascade</text>

    <!-- Node 2.3 -->
    <rect x="890" y="65" width="460" height="145" rx="6" fill="#1e1435" stroke="#9333ea"/>
    <text x="905" y="92" fill="#c084fc" font-size="12" font-weight="700">2.3 Event Grid Alert Dispatch</text>
    <text x="905" y="114" fill="#e9d5ff" font-size="11">&#x2022; Event Type: Microsoft.Foundry.CircuitBreakerTripped</text>
    <text x="905" y="134" fill="#e9d5ff" font-size="11">&#x2022; Ingests loop depth, token waste &amp; offending agent OID</text>
    <text x="905" y="154" fill="#e9d5ff" font-size="11">&#x2022; Dispatches webhook to Autonomous Quarantine Engine</text>
    <text x="905" y="176" fill="#e9d5ff" font-size="11">&#x2022; Fires high-priority alert to Platform Engineering Teams</text>
    <text x="905" y="196" fill="#34d399" font-size="11" font-weight="600">&#x2714; Incident created within 4.2 seconds</text>
  </g>

  <!-- Swimlane 3: Plane 3 - Workload Quarantine & Remediation (Bottom Swimlane) -->
  <g transform="translate(30, 625)" filter="url(#glow3)">
    <rect width="1380" height="240" rx="8" fill="#18182b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="16" y="16" width="400" height="28" rx="4" fill="#991b1b"/>
    <text x="216" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">PLANE 3: AUTONOMOUS IDENTITY QUARANTINE &amp; REMEDIATION</text>

    <!-- Node 3.1 -->
    <rect x="30" y="65" width="380" height="150" rx="6" fill="#10101a" stroke="#7f1d1d"/>
    <text x="45" y="92" fill="#f87171" font-size="12" font-weight="700">3.1 Entra ID App Role Revocation</text>
    <text x="45" y="114" fill="#fca5a5" font-size="11">&#x2022; Microsoft Graph v2.x invocation:</text>
    <text x="45" y="134" fill="#fca5a5" font-size="10.5">  DELETE /servicePrincipals/{id}/appRoleAssignments/{rid}</text>
    <text x="45" y="154" fill="#fca5a5" font-size="11">&#x2022; Freezes offending agent workload identity</text>
    <text x="45" y="176" fill="#fca5a5" font-size="11">&#x2022; Subsequent tokens rejected at APIM with HTTP 401</text>
    <text x="45" y="198" fill="#34d399" font-size="11" font-weight="600">&#x2714; Immediate containment in 1.8 seconds</text>

    <!-- Node 3.2 -->
    <rect x="450" y="65" width="440" height="150" rx="6" fill="#10101a" stroke="#7f1d1d"/>
    <text x="465" y="92" fill="#f87171" font-size="12" font-weight="700">3.2 Blast-Radius Protection Verification</text>
    <text x="465" y="114" fill="#cbd5e1" font-size="11">&#x2022; Production ERP, S/4HANA &amp; Web workloads continue unaffected</text>
    <text x="465" y="134" fill="#cbd5e1" font-size="11">&#x2022; Shared regional OpenAI 240k TPM quota preserved</text>
    <text x="465" y="154" fill="#cbd5e1" font-size="11">&#x2022; 16-test Pester matrix confirms zero bleed across identities</text>
    <text x="465" y="176" fill="#cbd5e1" font-size="11">&#x2022; Decision memory locks state: QUARANTINED_CIRCUIT_TRIP</text>
    <text x="465" y="198" fill="#34d399" font-size="11" font-weight="600">&#x2714; Zero cascade failure propagation</text>

    <!-- Node 3.3 -->
    <rect x="930" y="65" width="420" height="150" rx="6" fill="#0c1e38" stroke="#38bdf8"/>
    <text x="945" y="92" fill="#38bdf8" font-size="12" font-weight="700">3.3 SRE Restoration &amp; Unquarantine</text>
    <text x="945" y="114" fill="#cbd5e1" font-size="11">&#x2022; Teams Bot notification contains /restore command</text>
    <text x="945" y="134" fill="#cbd5e1" font-size="11">&#x2022; FinOps Director signs off on fixed schema / prompt</text>
    <text x="945" y="154" fill="#cbd5e1" font-size="11">&#x2022; App role assignment re-instated via Graph API</text>
    <text x="945" y="176" fill="#cbd5e1" font-size="11">&#x2022; Audit trail committed to git &amp; MariaDB log</text>
    <text x="945" y="198" fill="#34d399" font-size="11" font-weight="600">&#x2714; Fully auditable sovereign recovery cycle</text>
  </g>

  <!-- Flow Arrows Across Planes -->
  <line x1="310" y1="200" x2="360" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arB3)"/>
  <line x1="660" y1="200" x2="710" y2="200" stroke="#34d399" stroke-width="2" marker-end="url(#arG3)"/>
  <line x1="1010" y1="200" x2="1050" y2="200" stroke="#ef4444" stroke-width="2" marker-end="url(#arR3)"/>

  <path d="M 860 200 L 860 280 L 180 280 L 180 435" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arB3)"/>
  <line x1="340" y1="480" x2="390" y2="480" stroke="#6366f1" stroke-width="2" marker-end="url(#arB3)"/>
  <line x1="850" y1="480" x2="890" y2="480" stroke="#9333ea" stroke-width="2" marker-end="url(#arB3)"/>

  <path d="M 1120 515 L 1120 590 L 220 590 L 220 690" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arR3)"/>
  <line x1="410" y1="740" x2="450" y2="740" stroke="#ef4444" stroke-width="2" marker-end="url(#arR3)"/>
  <line x1="890" y1="740" x2="930" y2="740" stroke="#38bdf8" stroke-width="2" marker-end="url(#arB3)"/>
</svg>