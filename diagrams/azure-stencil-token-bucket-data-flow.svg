    <rect x="16" y="95" width="448" height="230" rx="4" fill="#0b1120" stroke="#312e81"/>
    <text x="26" y="120" fill="#c7d2fe" font-size="11" font-weight="600">AzureDiagnostics | where TimeGenerated &gt; ago(5m)</text>
    <text x="26" y="140" fill="#94a3b8" font-size="10.5">| summarize CallCount = count(), TotalTokens = sum(Tokens)</text>
    <text x="26" y="158" fill="#94a3b8" font-size="10.5">  Throttle429Count = countif(responseCode_d == 429)</text>
    <text x="26" y="176" fill="#94a3b8" font-size="10.5">  by SessionId, AgentOid, bin(TimeGenerated, 1m)</text>
    <text x="26" y="196" fill="#ef4444" font-size="11" font-weight="600">| where CallCount &gt; 12 or TotalTokens &gt; 18000 or Throttle429Count &gt; 0</text>
