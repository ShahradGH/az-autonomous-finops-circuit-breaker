    <text x="26" y="402" fill="#c7d2fe" font-size="11" font-weight="600">1. Autonomous Kill-Switch Trigger:</text>
    <text x="26" y="422" fill="#94a3b8" font-size="10.5">&#x2022; Emits Event Grid: Microsoft.Foundry.CircuitBreakerTripped</text>
    <text x="26" y="442" fill="#94a3b8" font-size="10.5">&#x2022; Payload: { sessionId, agentOid, burnVelocity, tripReason }</text>

    <text x="26" y="472" fill="#c7d2fe" font-size="11" font-weight="600">2. Identity Quarantine (Entra ID):</text>
    <text x="26" y="492" fill="#94a3b8" font-size="10.5">&#x2022; Calls Microsoft Graph v2.x to revoke AppRoleAssignment</text>
    <text x="26" y="512" fill="#94a3b8" font-size="10.5">&#x2022; Subsequent tokens from agent principal rejected (401)</text>

    <text x="26" y="542" fill="#c7d2fe" font-size="11" font-weight="600">3. Operational Notification:</text>
    <text x="26" y="562" fill="#94a3b8" font-size="10.5">&#x2022; Posts forensic card to Teams #platform-finops-alerts</text>
    <text x="26" y="582" fill="#94a3b8" font-size="10.5">&#x2022; Contains exact loop depth, token waste, and restart command</text>

    <rect x="26" y="605" width="428" height="55" rx="4" fill="#18182b"/>
    <text x="36" y="628" fill="#34d399" font-size="11" font-weight="600">&#x2714; Sibling Workloads 100% Unaffected</text>
    <text x="36" y="646" fill="#94a3b8" font-size="10.5">Mean Time to Containment (MTTC): 7.8 seconds</text>
  </g>

  <!-- Connectors -->
