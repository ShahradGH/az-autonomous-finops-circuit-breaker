    <rect x="16" y="405" width="248" height="270" rx="4" fill="#0b1329" stroke="#1e293b"/>
    <text x="26" y="430" fill="#cbd5e1" font-size="11">&#x2022; x-ratelimit-remaining-tokens</text>
    <text x="26" y="452" fill="#cbd5e1" font-size="11">&#x2022; x-ratelimit-limit-tokens: 18k</text>
    <text x="26" y="474" fill="#cbd5e1" font-size="11">&#x2022; x-ms-client-session: s-901</text>
    <text x="26" y="496" fill="#cbd5e1" font-size="11">&#x2022; traceparent: 00-7f2a...-01</text>
    <text x="26" y="518" fill="#34d399" font-size="11">&#x2714; Clean execution cycle</text>
    <rect x="26" y="540" width="228" height="110" rx="4" fill="#1e293b"/>
    <text x="36" y="565" fill="#38bdf8" font-size="11" font-weight="600">Enterprise SLA:</text>
    <text x="36" y="585" fill="#94a3b8" font-size="10.5">&#x2022; Zero latency penalty on pass</text>
    <text x="36" y="605" fill="#94a3b8" font-size="10.5">&#x2022; Deterministic policy budget</text>
    <text x="36" y="625" fill="#94a3b8" font-size="10.5">&#x2022; Cost allocation precision</text>
