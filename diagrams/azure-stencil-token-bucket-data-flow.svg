    <rect x="16" y="95" width="248" height="260" rx="4" fill="#0b1329" stroke="#1e293b"/>
    <text x="26" y="120" fill="#cbd5e1" font-size="11">&#x2022; Counter Key: sess-s-901</text>
    <text x="26" y="142" fill="#cbd5e1" font-size="11">&#x2022; Bucket Capacity: 18,000</text>
    <text x="26" y="164" fill="#cbd5e1" font-size="11">&#x2022; Refill Rate: 300 tokens/sec</text>
    <text x="26" y="186" fill="#cbd5e1" font-size="11">&#x2022; Current Bucket: 4,200 tokens</text>
    <text x="26" y="208" fill="#cbd5e1" font-size="11">&#x2022; Request Cost: 1,450 tokens</text>
    <rect x="26" y="225" width="228" height="50" rx="4" fill="#1e293b"/>
    <text x="36" y="248" fill="#34d399" font-size="11" font-weight="600">Decision: 4,200 &gt; 1,450</text>
