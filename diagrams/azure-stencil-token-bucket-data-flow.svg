    <text x="26" y="120" fill="#cbd5e1" font-size="11">&#x2022; Endpoint: foundry-gpt4o.openai</text>
    <text x="26" y="142" fill="#cbd5e1" font-size="11">&#x2022; Auth: Managed Identity VNet</text>
    <text x="26" y="164" fill="#cbd5e1" font-size="11">&#x2022; Model: gpt-4o-2024-08-06</text>
    <text x="26" y="186" fill="#cbd5e1" font-size="11">&#x2022; Tokens Used: 1,380</text>
    <text x="26" y="208" fill="#cbd5e1" font-size="11">&#x2022; Prompt: 1,120 / Compl: 260</text>
