    <rect x="26" y="235" width="428" height="70" rx="4" fill="#18182b"/>
    <text x="36" y="258" fill="#ef4444" font-size="11" font-weight="600">Anomaly Signature Detected:</text>
    <text x="36" y="278" fill="#fca5a5" font-size="10.5">Recursive retry pattern: 14 calls in 52 seconds (Depth 5 loop)</text>

    <text x="24" y="360" fill="#a5b4fc" font-size="13" font-weight="700">Autonomous Quarantine &amp; Blast Radius Containment</text>
