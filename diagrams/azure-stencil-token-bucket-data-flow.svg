    <text x="26" y="300" fill="#cbd5e1" font-size="11">&#x2022; Execution Time: 1.4ms</text>
    <text x="26" y="322" fill="#34d399" font-size="11" font-weight="600">&#x2714; DISPATCH PERMITTED</text>

