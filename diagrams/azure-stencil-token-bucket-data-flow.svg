  <line x1="590" y1="200" x2="620" y2="200" stroke="#34d399" stroke-width="2" marker-end="url(#arrowG)"/>
  <path d="M 590 540 L 910 540 L 910 240 L 930 240" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="900" y1="200" x2="930" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowB)"/>
